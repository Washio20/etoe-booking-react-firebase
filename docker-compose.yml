version: '3.8'

services:
  app:
    build:
      context: .
      target: ${TARGET:-builder}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    command: ${COMMAND:-npm run dev}
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge